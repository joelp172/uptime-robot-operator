---
name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Determine Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    outputs:
      new_release_published: ${{ steps.semantic_dry.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic_dry.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Semantic Release (dry run)
        id: semantic_dry
        uses: cycjimmy/semantic-release-action@v6
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/exec
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build and Push
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # Required for cosign keyless signing
      security-events: write # Required for uploading SARIF results
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/uptime-robot-operator
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ needs.release.outputs.new_release_version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build Image (scan gate, no push)
        id: build_scan
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: false
          load: true
          platforms: linux/amd64
          tags: uptime-robot-operator:scan-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: uptime-robot-operator:scan-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy vulnerability scanner (table format)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: uptime-robot-operator:scan-${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build and Push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM (SPDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/uptime-robot-operator@${{ steps.build.outputs.digest }}
          format: 'spdx-json'
          output: 'sbom-spdx.json'

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/uptime-robot-operator@${{ steps.build.outputs.digest }}
          format: 'cyclonedx'
          output: 'sbom-cyclonedx.json'

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom-v${{ needs.release.outputs.new_release_version }}
          path: |
            sbom-spdx.json
            sbom-cyclonedx.json

      # Image Signing with Cosign
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1

      - name: Sign container images
        run: |
          IMAGE_DIGEST="ghcr.io/${{ github.repository_owner }}/uptime-robot-operator@${{ steps.build.outputs.digest }}"
          echo "Signing ${IMAGE_DIGEST}"
          cosign sign --yes "${IMAGE_DIGEST}"

      - name: Attest SBOM to images
        run: |
          IMAGE_DIGEST="ghcr.io/${{ github.repository_owner }}/uptime-robot-operator@${{ steps.build.outputs.digest }}"
          echo "Attesting SBOM to ${IMAGE_DIGEST}"
          cosign attest --yes --predicate sbom-spdx.json --type spdxjson "${IMAGE_DIGEST}"
          cosign attest --yes --predicate sbom-cyclonedx.json --type cyclonedx "${IMAGE_DIGEST}"

  publish_release:
    name: Publish Release
    needs: [release, build]
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    outputs:
      new_release_published: ${{ steps.semantic_publish.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic_publish.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v8
        with:
          name: sbom-v${{ needs.release.outputs.new_release_version }}
          path: sbom-v${{ needs.release.outputs.new_release_version }}

      - name: Prepare SBOM files for semantic-release
        run: |
          ARTIFACT_DIR="sbom-v${{ needs.release.outputs.new_release_version }}"
          mv "${ARTIFACT_DIR}/sbom-spdx.json" ./sbom-spdx.json
          mv "${ARTIFACT_DIR}/sbom-cyclonedx.json" ./sbom-cyclonedx.json
      - name: Semantic Release (publish)
        id: semantic_publish
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/exec
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-manifests:
    name: Release Manifests
    needs: [release, publish_release]
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v${{ needs.release.outputs.new_release_version }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@v2.8.5

      - name: Generate Installer
        run: make build-installer IMG=ghcr.io/${{ github.repository_owner }}/uptime-robot-operator:v${{ needs.release.outputs.new_release_version }}

      - name: Publish OCI Artifact
        run: |
          flux push artifact \
            oci://ghcr.io/${{ github.repository_owner }}/uptime-robot-operator-manifests:v${{ needs.release.outputs.new_release_version }} \
            --path=dist --source=${{ github.repositoryUrl }} --revision="v${{ needs.release.outputs.new_release_version }}@sha1:${{ github.sha }}"

  release-helm-chart:
    name: Release Helm Chart
    needs: [release, publish_release]
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v${{ needs.release.outputs.new_release_version }}

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.20.0

      - name: Update Chart Version
        run: |
          sed -i "s/^version:.*/version: ${{ needs.release.outputs.new_release_version }}/" charts/uptime-robot-operator/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"v${{ needs.release.outputs.new_release_version }}\"/" charts/uptime-robot-operator/Chart.yaml

      - name: Package Helm Chart
        run: |
          helm package charts/uptime-robot-operator -d dist/

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push Helm Chart to OCI Registry
        run: |
          helm push dist/uptime-robot-operator-${{ needs.release.outputs.new_release_version }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
